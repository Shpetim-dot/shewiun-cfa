name: Import exact Shewiun CFA platform ZIP

on:
  push:
    branches: [import-zip-platform]
    paths:
      - ".github/import-payload/platform.zip.b64.part*"

permissions:
  contents: write

jobs:
  verify-and-replace-main:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out import branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rebuild and verify the original archive bytes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/shewiun-import/unpacked
          cat .github/import-payload/platform.zip.b64.part* | base64 --decode > /tmp/shewiun-import/platform.zip
          echo "f59e1c73e2b2ab5f5f2de37f774537096625650afecaf76b0eba51316b074098  /tmp/shewiun-import/platform.zip" | sha256sum -c -
          unzip -tq /tmp/shewiun-import/platform.zip
          unzip -q /tmp/shewiun-import/platform.zip -d /tmp/shewiun-import/unpacked
          test -f /tmp/shewiun-import/unpacked/shewiun-cfa/app/main.py
          test -f /tmp/shewiun-import/unpacked/shewiun-cfa/static/app.js
          test -f /tmp/shewiun-import/unpacked/shewiun-cfa/static/style.css
          test -f /tmp/shewiun-import/unpacked/shewiun-cfa/static/index.html
      - name: Test the ZIP without changing its contents
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/shewiun-import/unpacked/shewiun-cfa
          python -m pip install -r requirements-dev.txt
          python -m compileall -q app
          python -m pytest -q
      - name: Replace repository root with the exact ZIP root
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
          mkdir -p /tmp/shewiun-import/original-workflows
          cp -a .github/workflows/. /tmp/shewiun-import/original-workflows/
          python - <<'PY'
          from pathlib import Path
          import shutil

          root = Path.cwd()
          source = Path("/tmp/shewiun-import/unpacked/shewiun-cfa")
          if not (source / "app/main.py").is_file():
              raise SystemExit("Archive did not contain the expected shewiun-cfa root")
          for item in root.iterdir():
              if item.name == ".git":
                  continue
              if item.is_dir():
                  shutil.rmtree(item)
              else:
                  item.unlink()
          shutil.copytree(source, root, dirs_exist_ok=True)
          # Preserve existing workflow files for this first commit only: the
          # current GitHub App token can write Contents but cannot commit
          # workflow-file changes. Restore exact ZIP workflow files by API
          # after the source tree is successfully imported.
          shutil.copytree(
              Path("/tmp/shewiun-import/original-workflows"),
              root / ".github" / "workflows",
              dirs_exist_ok=True,
          )
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import exact Shewiun CFA platform ZIP"
          git push origin HEAD:main
